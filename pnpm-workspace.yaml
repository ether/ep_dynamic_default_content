# picomatch and serialize-javascript arrive only as transitive dev dependencies
# (via microbundle), so `pnpm update` cannot move them. The selectors pin the
# versions that clear the advisories without dragging the rest of the
# microbundle tree onto an incompatible major.
#
# These are kept in sync with the npm-style `overrides` block in package.json,
# which npm still reads. pnpm 11 no longer reads `pnpm.overrides` from
# package.json — the pnpm copy must live here or the lockfile and the install
# disagree (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH).
overrides:
  picomatch: '2.3.1'
  serialize-javascript: '^7.0.3'
